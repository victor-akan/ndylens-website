name: Validate blog article PR

on:
  pull_request:
    paths:
      - "blog/posts/**"
      - "assets/blog/uploads/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build production view
        run: npm run build && mv _site _site-public
      - name: Build preview view
        run: BLOG_PREVIEW=1 npm run build
      - name: Validate article and rendered output
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validate-blog-pr.mjs
